<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>go-pacs</title>
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="titlebar">
    <div class="segmented" id="nav">
      <button data-tab="archive">Studies</button>
      <button data-tab="network">Network</button>
      <button data-tab="query">Query</button>
      <button data-tab="tasks">Tasks</button>
      <button data-tab="inspector">Inspector</button>
    </div>
    <span class="spacer"></span>
    <span id="conn" class="conn"><span class="dot"></span>backend</span>
  </div>

  <div class="panels">
    <div class="panel flush col" id="panel-archive"></div>
    <div class="panel padded" id="panel-network"></div>
    <div class="panel padded" id="panel-query"></div>
    <div class="panel padded" id="panel-tasks"></div>
    <div class="panel padded" id="panel-inspector"></div>
  </div>

  <div id="statusline">Ready</div>

  <script src="/js/app.js"></script>
  <script src="/js/tabs/archive.js"></script>
  <script src="/js/tabs/network.js"></script>
  <script src="/js/tabs/query.js"></script>
  <script src="/js/tabs/tasks.js"></script>
  <script src="/js/tabs/inspector.js"></script>
</body>
</html>
